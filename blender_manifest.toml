schema_version = "1.0.0"

# Unique add-on id (lowercase). Becomes the module name bl_ext.<repo>.blendcap.
id = "blendcap"
# Provisional pre-1.0 adapter display version, not an upstream BlendCap version.
version = "0.9.0"
name = "StudioFree MoCap"
tagline = "Video to reviewed, editable Character animation"
maintainer = "StudioFree MoCap contributors"
type = "add-on"

website = "https://github.com/dsguffey/BlendCap-Assisted-MultiPerson"

# First Blender version with the extension/manifest system. BlendCap's code
# also uses Blender 5.x APIs with 4.3/4.4 fallbacks already in place.
blender_version_min = "4.2.0"

# The BlendCap-derived public integration remains GPL-3.0-or-later.
# The model weights and retained third-party
# code ship under their own terms - full texts in LICENSE + NOTICE.txt at
# the root and in licenses/.
license = [
  "SPDX:GPL-3.0-or-later",
]
copyright = [
  "2026 Arcomade",
]

tags = [
  "Animation",
  "Rigging",
  "Pipeline",
]

[permissions]
files = "Read video/project data, manage MoCap job artifacts, and export animation."

[build]
# Only consulted by `blender --command extension build`. Keeps runtime
# artifacts out of a built zip - especially venv/ and checkpoints/, which
# the installer rebuilds/downloads on the user's machine. Release zips are
# assembled by hand; this list also serves anyone building from a source
# checkout.
paths_exclude_pattern = [
  "/save_face_data.py",
  "__pycache__/",
  "*.pyc",
  "/.git/",
  "/venv/",
  "/checkpoints/",
  "*.blend1",
  "/installer/install.log",
  "/installer/install_marker.json",
]
